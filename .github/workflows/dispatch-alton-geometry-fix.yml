name: Dispatch Alton Towers after topology fix
on:
  push:
    branches: [agent/dispatch-alton-geometry-fix]
permissions:
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch main Alton Towers generation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${{ github.api_url }}/repos/${{ github.repository }}/actions/workflows/generate-themepark.yml/dispatches" \
            -d '{"ref":"main","inputs":{"park":"alton-towers-resort"}}'
