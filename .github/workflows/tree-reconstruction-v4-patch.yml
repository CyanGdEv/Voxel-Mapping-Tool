name: Tree Reconstruction V4 patch

on:
  push:
    branches:
      - agent/realistic-tree-presets-v1

permissions:
  contents: write

jobs:
  apply-tree-reconstruction-v4:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/realistic-tree-presets-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply V4 woodland inference integration
        run: node scripts/patch-tree-reconstruction-v4.mjs
      - name: Validate focused tree tests
        run: node --test test/tree-seed-detection.test.mjs test/woodland-tree-inference.test.mjs test/tree-reconstruction.test.mjs test/appearance-vegetation.test.mjs test/direct-world-palette-compatibility.test.mjs
      - name: Commit integration
        run: |
          if git diff --quiet -- src/lib/fidelity.mjs test/direct-world-palette-compatibility.test.mjs; then
            echo "Tree Reconstruction V4 integration already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/fidelity.mjs test/direct-world-palette-compatibility.test.mjs
          git commit -m "Infer individual trees inside LiDAR vegetation cover"
          git push origin HEAD:agent/realistic-tree-presets-v1
