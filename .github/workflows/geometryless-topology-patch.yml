name: Geometryless topology patch
on:
  push:
    branches: [agent/fix-geometryless-topology]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/fix-geometryless-topology
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply hardening
        run: node scripts/patch-geometryless-topology.mjs
      - name: Run focused regression
        run: node --test test/geometryless-topology.test.mjs
      - name: Commit production patch
        run: |
          if git diff --quiet -- src/lib/osm.mjs; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/osm.mjs
          git commit -m "Handle geometry-less evidence in map summaries"
          git push origin HEAD:agent/fix-geometryless-topology
