name: Tree live integration patch

on:
  push:
    branches:
      - agent/realistic-tree-presets-v1

permissions:
  contents: write

jobs:
  apply-tree-hook:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/realistic-tree-presets-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply live tree integration
        run: node scripts/patch-tree-live-integration.mjs
      - name: Commit integration
        run: |
          if git diff --quiet -- src/lib/raster.mjs; then
            echo "Tree integration already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/raster.mjs
          git commit -m "Wire high-fidelity trees into world compiler"
          git push origin HEAD:agent/realistic-tree-presets-v1
