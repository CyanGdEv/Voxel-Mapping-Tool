name: Dispatch Alton Towers postmerge

on:
  push:
    branches:
      - agent/dispatch-alton-postmerge

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch main Alton Towers generation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/generate-themepark.yml/dispatches" \
            -d '{"ref":"main","inputs":{"park":"alton-towers-resort"}}'
          echo "Dispatched generate-themepark.yml on main for alton-towers-resort"
