name: Tree species diversity patch

on:
  push:
    branches:
      - agent/realistic-tree-presets-v1

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/realistic-tree-presets-v1
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Apply diversity integration
        run: node scripts/patch-tree-species-diversity.mjs
      - name: Run focused tree tests
        run: node --test test/woodland-tree-inference.test.mjs test/tree-generator.test.mjs test/tree-reconstruction.test.mjs
      - name: Commit integration
        run: |
          if git diff --quiet -- src/lib/woodland-tree-inference.mjs; then
            echo "Already integrated"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/woodland-tree-inference.mjs
          git commit -m "Model deterministic mixed woodland species diversity"
          git push origin HEAD:agent/realistic-tree-presets-v1
